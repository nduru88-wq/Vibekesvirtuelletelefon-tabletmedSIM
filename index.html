<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ring</title>

  <!-- iPhone hjemmeskærm ikon -->
  <link rel="apple-touch-icon" sizes="180x180" href="telefon.png" />
  <link rel="apple-touch-icon" href="telefon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ring" />
  <link rel="icon" href="telefon.png" />

  <style>
    :root{
      --bg:#0b1220;
      --text:#fff;
      --muted:rgba(255,255,255,.78);
      --stroke:rgba(255,255,255,.14);
      --radius:18px;
      --shadow:0 10px 26px rgba(0,0,0,.35);

      /* lidt mere kompakt så intet klippes */
      --gap:12px;
      --pad:12px;

      --avatar:104px;         /* større end før, men ikke “full cover” */
      --cardPad:10px;
      --tagPadY:7px;
      --tagPadX:12px;
    }

    *{box-sizing:border-box}
    html,body{
      height:100%;
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
    }

    body{
      background:
        radial-gradient(1200px 800px at 50% 0%, rgba(80,140,255,.25), transparent 55%),
        radial-gradient(900px 600px at 10% 90%, rgba(0,255,170,.10), transparent 55%),
        var(--bg);
      color:var(--text);
      overflow:hidden; /* ingen scroll */
    }

    .page{
      height:100%;
      padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      flex:0 0 auto;
      padding:6px 6px 0;
    }

    .topIcon{
      width:52px;
      height:52px;
      border-radius:14px;
      background:rgba(255,255,255,.08);
      border:1px solid var(--stroke);
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
    }
    .topIcon img{width:70%;height:70%;object-fit:contain}

    .titles{display:flex;flex-direction:column;align-items:center;gap:2px}
    h1{
      margin:0;
      font-size:clamp(20px,2.4vw,28px);
      line-height:1.1;
    }
    .hint{
      margin:0;
      font-size:clamp(12px,1.4vw,15px);
      color:var(--muted);
      text-align:center;
    }

    .grid{
      flex:1 1 auto;
      min-height:0;
      display:grid;
      gap:var(--gap);
      grid-template-columns:repeat(2,1fr);
      grid-auto-rows:1fr;
      align-content:stretch;
    }

    /* 4x2 i landscape på tablet */
    @media (min-width: 900px) and (orientation: landscape){
      .grid{ grid-template-columns:repeat(4, 1fr); }
    }

    /* hvis den er lav i højden, skru lige lidt ned */
    @media (max-height: 520px){
      :root{
        --avatar:96px;
        --gap:10px;
        --pad:10px;
        --cardPad:9px;
        --tagPadY:6px;
        --tagPadX:10px;
      }
      .topIcon{width:48px;height:48px}
    }

    .card{
      text-decoration:none;
      color:inherit;
      border-radius:var(--radius);
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.07));
      padding:var(--cardPad);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      min-height:0;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      user-select:none;

      /* farvekode pr person via --accent */
      outline:2px solid rgba(255,255,255,.03);
    }
    .card:active{ transform:scale(.985); }

    .avatar{
      width:var(--avatar);
      height:var(--avatar);
      border-radius:999px;
      overflow:hidden;
      border:3px solid rgba(255,255,255,.14);
      background:rgba(255,255,255,.08);
      box-shadow:
        0 10px 22px rgba(0,0,0,.32),
        0 0 0 5px color-mix(in srgb, var(--accent) 18%, transparent),
        0 0 26px color-mix(in srgb, var(--accent) 35%, transparent);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .initial{font-size:48px;font-weight:900}

    .meta{
      width:100%;
      text-align:center;
      margin-top:auto;           /* skubber info ned, så den altid ligger i bunden */
      padding-top:2px;
    }

    .name{
      margin:0;
      font-size:clamp(15px,1.8vw,21px);
      font-weight:900;
      line-height:1.05;
    }
    .phone{
      margin:4px 0 8px;
      font-size:clamp(12px,1.3vw,14px);
      color:var(--muted);
      line-height:1.05;
    }

    .callTag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:var(--tagPadY) var(--tagPadX);
      border-radius:999px;
      font-weight:900;
      font-size:clamp(12px,1.25vw,14px);
      letter-spacing:.3px;
      background:color-mix(in srgb, var(--accent) 26%, rgba(255,255,255,.08));
      border:1px solid color-mix(in srgb, var(--accent) 48%, rgba(255,255,255,.14));
      color:#fff;
      box-shadow:0 8px 18px rgba(0,0,0,.25);
    }
    .dot{
      width:10px;height:10px;border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 12px color-mix(in srgb, var(--accent) 70%, transparent);
    }
  </style>
</head>

<body>
<div class="page">

  </main>
