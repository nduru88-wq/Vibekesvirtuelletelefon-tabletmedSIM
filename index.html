<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vibekes telefon</title>

  <link rel="apple-touch-icon" sizes="180x180" href="telefon.png" />
  <link rel="apple-touch-icon" href="telefon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vibekes telefon" />
  <link rel="icon" href="telefon.png" />

  <style>
    :root{
      --bg:#0b1220;
      --text:#fff;
      --muted:rgba(255,255,255,.78);
      --stroke:rgba(255,255,255,.14);
      --shadow:0 10px 26px rgba(0,0,0,.35);

      --pad:12px;
      --gap:14px;
      --radius:22px;

      /* Fokus */
      --focusScale:1.03;
      --unfocusOpacity:.55;

      /* Ring-knap */
      --btnH:56px;
      --btnHSmall:46px;

      /* Fokusramme */
      --focusBorder:5px;

      /* Avatar sizes */
      --avatarBig:clamp(170px, 26vh, 320px);
      --avatarSmall:clamp(70px, 9vh, 110px);

      /* Layout */
      --sideColW: min(460px, 34vw);
      --centerColW: min(560px, 36vw);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    body{
      background:
        radial-gradient(1200px 800px at 50% 0%, rgba(80,140,255,.25), transparent 55%),
        radial-gradient(900px 600px at 10% 90%, rgba(0,255,170,.10), transparent 55%),
        var(--bg);
      color:var(--text);
      overflow:hidden;
    }

    .page{
      height:100%;
      padding:var(--pad);
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
      justify-content:flex-start;
    }

    /* Header: centreret (grid) */
    .header{
      width:100%;
      display:grid;
      grid-template-columns: 52px 1fr 52px;
      align-items:center;
      justify-items:center;
      gap:12px;
      padding-top:4px;
      user-select:none;
    }
    .topIcon{
      width:52px;height:52px;border-radius:14px;
      background:rgba(255,255,255,.08);
      border:1px solid var(--stroke);
      display:grid;place-items:center;
      box-shadow:var(--shadow);
    }
    .topIcon img{width:70%;height:70%;object-fit:contain}
    h1{
      margin:0;
      font-size:clamp(18px,2.2vw,28px);
      letter-spacing:.2px;
      text-align:center;
      justify-self:center;
    }

    .stage{
      position:relative;
      width:100%;
      flex:1;
      display:flex;
      align-items:stretch;
      justify-content:center;
      overflow:hidden;
    }

    /* 3-kolonne layout */
    .layout{
      position:relative;
      width:min(1600px, 100%);
      height:100%;
      display:grid;
      grid-template-columns: var(--sideColW) var(--centerColW) var(--sideColW);
      gap:var(--gap);
      padding:10px;
      border-radius:28px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 20px 60px rgba(0,0,0,.25);
    }

    .sideCol{
      display:grid;
      grid-template-rows:repeat(4, 1fr);
      gap:var(--gap);
      min-height:0;
    }

    .centerCol{
      display:flex;
      align-items:stretch;
      justify-content:center;
      min-height:0;
    }

    .tile{
      position:relative;
      border-radius:var(--radius);
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.07));
      overflow:hidden;

      opacity:var(--unfocusOpacity);
      transform:scale(.98);
      filter:saturate(.9);
      transition:transform 220ms ease, opacity 220ms ease, filter 220ms ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      cursor:pointer;
      min-height:0;
    }

    .tile.focused{
      opacity:1;
      transform:scale(var(--focusScale));
      filter:saturate(1.05);
      cursor:default;
    }

    /* Peter (center) */
    .tile.big{
      padding:16px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:14px;
    }

    /* Små sidekort: avatar venstre, tekst/højre */
    .tile.small{
      padding:12px;
      display:grid;
      grid-template-columns: var(--avatarSmall) 1fr;
      gap:12px;
      align-items:center;
    }

    /* Avatar */
    .avatar{
      width:var(--avatarSmall);
      height:var(--avatarSmall);
      border-radius:999px;
      overflow:hidden;
      border:4px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      box-shadow:
        0 10px 22px rgba(0,0,0,.32),
        0 0 0 6px color-mix(in srgb, var(--accent) 20%, transparent),
        0 0 40px color-mix(in srgb, var(--accent) 40%, transparent);
      flex-shrink:0;
      pointer-events:none;
    }
    .tile.big .avatar{
      width:var(--avatarBig);
      height:var(--avatarBig);
    }
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}

    /* Meta */
    .meta{
      width:100%;
      text-align:center;
      padding:0 8px 4px;
      pointer-events:none;
    }
    .tile.big .meta{ padding:0 10px 8px; }

    /* Meta på små tiles: højrestillet blok */
    .tile.small .meta{
      text-align:left;
      padding:0;
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:0;
    }

    .name{
      margin:0;
      font-weight:950;
      letter-spacing:.2px;
      font-size:clamp(18px, 2.2vh, 26px);
      line-height:1.05;
    }
    .tile.small .name{
      font-size:clamp(16px, 2.2vh, 22px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .phone{
      margin:0;
      font-size:clamp(13px, 1.8vh, 16px);
      color:var(--muted);
      line-height:1.1;
    }
    .tile.small .phone{
      font-size:clamp(12px, 1.8vh, 15px);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    /* Ring-knap */
    .callBtn{
      width:100%;
      height:var(--btnHSmall);
      border-radius:16px;
      border:1px solid color-mix(in srgb, var(--accent) 55%, rgba(255,255,255,.16));
      background:color-mix(in srgb, var(--accent) 32%, rgba(255,255,255,.10));
      color:#fff;
      font-weight:950;
      font-size:16px;
      letter-spacing:.5px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      user-select:none;
      opacity:.9;
    }
    .tile.big .callBtn{
      height:var(--btnH);
      font-size:18px;
      border-radius:18px;
      pointer-events:auto;
      opacity:1;
    }
    .callBtn:active{ transform:scale(.98); }
    .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}

    /* Små: knap lidt mere “liste-agtig” */
    .tile.small .callBtn{
      height:var(--btnHSmall);
      border-radius:14px;
      justify-content:flex-start;
      padding-left:14px;
    }

    /* Fokusramme */
    .focusBox{
      position:absolute;
      border-radius:calc(var(--radius) + 10px);
      border:5px solid rgba(255,255,255,.92);
      box-shadow:
        0 0 0 7px rgba(0,0,0,.28),
        0 18px 60px rgba(0,0,0,.45);
      pointer-events:none;
      transition: left 180ms ease, top 180ms ease, width 180ms ease, height 180ms ease;
      will-change:left,top,width,height;
      z-index:50;
    }

    /* === OVERLAY CONFIRM (ikke gennemsigtigt) === */
    .overlay{
      position:fixed;
      inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background:#05070c; /* HELT dækkende, ikke gennemsigtigt */
      z-index:9999;
      padding:18px;
      -webkit-tap-highlight-color: transparent;
    }
    .overlay.show{ display:flex; }

    .dialog{
      width:min(920px, 100%);
      border-radius:28px;
      border:2px solid rgba(255,255,255,.18);
      background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.08));
      box-shadow:0 30px 80px rgba(0,0,0,.55);
      padding:22px;
      text-align:center;
    }

    .dialogTitle{
      margin:0 0 10px;
      font-weight:1000;
      letter-spacing:.8px;
      font-size:clamp(26px, 4.2vw, 52px);
      text-transform:uppercase;
    }
    .dialogName{
      margin:0 0 18px;
      font-weight:1000;
      font-size:clamp(22px, 3.4vw, 44px);
      color:#fff;
      text-transform:uppercase;
    }
    .dialogHint{
      margin:0 0 18px;
      opacity:.85;
      font-size:clamp(14px, 2.0vw, 20px);
    }

    .btnRow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
    }

    .bigBtn{
      height:clamp(64px, 10vh, 96px);
      border-radius:22px;
      border:2px solid rgba(255,255,255,.18);
      font-size:clamp(18px, 2.4vw, 30px);
      font-weight:1000;
      letter-spacing:.6px;
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      user-select:none;
      cursor:pointer;
      box-shadow:0 18px 50px rgba(0,0,0,.35);
      -webkit-tap-highlight-color: transparent;
    }
    .bigBtn:active{ transform:scale(.99); }

    .yes{
      background:linear-gradient(180deg, rgba(0,255,140,.38), rgba(0,255,140,.18));
      border-color:rgba(0,255,140,.55);
    }
    .no{
      background:linear-gradient(180deg, rgba(255,60,60,.38), rgba(255,60,60,.18));
      border-color:rgba(255,60,60,.55);
    }

    /* Responsivt */
    @media (max-width:1100px){
      .layout{
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .sideCol{ grid-template-rows:repeat(4, auto); }
    }
    @media (max-height:700px){
      :root{
        --btnH:52px;
        --btnHSmall:44px;
        --avatarBig:clamp(150px, 24vh, 280px);
        --avatarSmall:clamp(68px, 9vh, 100px);
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="header">
      <div class="topIcon"><img src="telefon.png" alt=""></div>
      <h1>Vibekes telefon</h1>
      <div class="topIcon"><img src="telefon.png" alt=""></div>
    </div>

    <div class="stage">
      <div class="layout" id="layout" aria-label="Kontakter">
        <div class="sideCol" id="leftCol" aria-label="Venstre kontakter"></div>
        <div class="centerCol" id="centerCol" aria-label="Peter (center)"></div>
        <div class="sideCol" id="rightCol" aria-label="Højre kontakter"></div>

        <div class="focusBox" id="focusBox" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <!-- Confirm overlay -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
      <p class="dialogTitle" id="dlgTitle">Vil du ringe til</p>
      <p class="dialogName" id="dlgName">Navn</p>
      <p class="dialogHint">Tryk <b>JA</b> for at ringe, eller <b>NEJ</b> for at fortryde.</p>
      <div class="btnRow">
        <div class="bigBtn yes" id="btnYes">JA, RING</div>
        <div class="bigBtn no" id="btnNo">NEJ</div>
      </div>
    </div>
  </div>

  <script>
    // === DATA (9 kontakter inkl. Inge Boye) ===
    let contacts = [
      { name:"Peter",     phone:"+4520324378", display:"+45 20 32 43 78", img:"peter.jpg",     accent:"#ffd24a" },
      { name:"Poula",     phone:"+4521538213", display:"+45 21 53 82 13", img:"poula.jpg",     accent:"#54e6a9" },
      { name:"Bente",     phone:"+4528223687", display:"+45 28 22 36 87", img:"bente.jpg",     accent:"#6fb7ff" },
      { name:"Britta",    phone:"+4523985223", display:"+45 23 98 52 23", img:"britta.jpg",    accent:"#ff7ad9" },
      { name:"Else",      phone:"+4542769137", display:"+45 42 76 91 37", img:"else.jpg",      accent:"#ff9b54" },
      { name:"Herdis",    phone:"+4521764268", display:"+45 21 76 42 68", img:"herdis.jpg",    accent:"#b58cff" },
      { name:"Hanne",     phone:"+4528965403", display:"+45 28 96 54 03", img:"hanne.jpg",     accent:"#ff4d4d" },
      { name:"Karen",     phone:"+4541663491", display:"+45 41 66 34 91", img:"karen.jpg",     accent:"#39d0ff" },
      { name:"Inge Boye", phone:"+4522355339", display:"+45 22 35 53 39", img:"ingeboye.jpg",  accent:"#7cff6b" },
    ];

    const AUTO_BACK_MS = 10_000;

    const leftCol  = document.getElementById("leftCol");
    const rightCol = document.getElementById("rightCol");
    const centerCol= document.getElementById("centerCol");
    const layout   = document.getElementById("layout");
    const focusBox = document.getElementById("focusBox");

    // Overlay
    const overlay  = document.getElementById("overlay");
    const dlgName  = document.getElementById("dlgName");
    const btnYes   = document.getElementById("btnYes");
    const btnNo    = document.getElementById("btnNo");

    function indexOfPeter(){
      return Math.max(0, contacts.findIndex(c => c.name.toLowerCase() === "peter"));
    }

    // Træk Peter ud til center og fordel resten alfabetisk i siderne
    const peterIndex = indexOfPeter();
    const peter = contacts[peterIndex];

    const others = contacts
      .filter((_, i) => i !== peterIndex)
      .sort((a,b) => a.name.localeCompare(b.name, "da", { sensitivity:"base" }));

    const left  = others.slice(0, 4);
    const right = others.slice(4, 8);

    // Fokus rækkefølge: venstre (0-3), Peter (4), højre (5-8)
    const tileOrder = [];
    const peterGlobalIndex = 4;
    let focusedIndex = peterGlobalIndex;

    // Auto-retur timer
    let autoBackTimer = null;
    function clearAutoBack(){
      if (autoBackTimer) { clearTimeout(autoBackTimer); autoBackTimer = null; }
    }
    function scheduleAutoBackIfNeeded(){
      clearAutoBack();
      if (overlay.classList.contains("show")) return;
      if (focusedIndex !== peterGlobalIndex) {
        autoBackTimer = setTimeout(() => setFocusPeter(), AUTO_BACK_MS);
      }
    }

    // Overlay state
    let pendingCall = null; // { name, phone }
    function openConfirm(c){
      pendingCall = { name:c.name, phone:c.phone };
      dlgName.textContent = c.name.toUpperCase();
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
      clearAutoBack();
    }
    function closeConfirm(){
      pendingCall = null;
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      scheduleAutoBackIfNeeded();
    }
    function callNumber(phone){
      location.href = `tel:${phone}`;
    }

    // Klik udenfor dialog = Nej (overlay er ikke gennemsigtigt, men vi kan stadig lukke ved klik på baggrunden)
    overlay.addEventListener("click", (e) => {
      if (e.target === overlay) closeConfirm();
    });
    btnNo.addEventListener("click", closeConfirm);
    btnYes.addEventListener("click", () => {
      if (!pendingCall) return;
      const phone = pendingCall.phone;
      closeConfirm();
      callNumber(phone);
    });

    // Build tiles
    function makeTile(c, globalIndex, sizeClass){
      const tile = document.createElement("div");
      tile.className = `tile ${sizeClass}`;
      tile.style.setProperty("--accent", c.accent);
      tile.dataset.index = String(globalIndex);

      tile.innerHTML = `
        <div class="avatar"><img src="${c.img}" alt="${c.name}"></div>
        <div class="meta">
          <p class="name">${c.name}</p>
          <p class="phone">${c.display}</p>
          <div class="callBtn" role="button" aria-label="Ring til ${c.name}">
            <span class="dot"></span> RING
          </div>
        </div>
      `;

      tile.addEventListener("click", () => {
        if (overlay.classList.contains("show")) return;

        if (sizeClass === "small") {
          if (focusedIndex === globalIndex) openConfirm(c);
          else setFocus(globalIndex);
        } else {
          if (focusedIndex !== globalIndex) setFocus(globalIndex);
        }
      }, { passive:true });

      const btn = tile.querySelector(".callBtn");
      if (sizeClass === "big") {
        // Peter: ring på knappen
        btn.style.pointerEvents = "auto";
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (overlay.classList.contains("show")) return;
          callNumber(c.phone);
        });
      } else {
        // små: knappen støtter også klik, men følger samme “fokus først” logik
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          if (overlay.classList.contains("show")) return;
          if (focusedIndex === globalIndex) openConfirm(c);
          else setFocus(globalIndex);
        });
      }

      return tile;
    }

    // Insert tiles
    left.forEach((c, idx) => {
      const globalIndex = idx;
      const tile = makeTile(c, globalIndex, "small");
      leftCol.appendChild(tile);
      tileOrder[globalIndex] = tile;
    });

    const peterTile = makeTile(peter, peterGlobalIndex, "big");
    centerCol.appendChild(peterTile);
    tileOrder[peterGlobalIndex] = peterTile;

    right.forEach((c, idx) => {
      const globalIndex = 5 + idx;
      const tile = makeTile(c, globalIndex, "small");
      rightCol.appendChild(tile);
      tileOrder[globalIndex] = tile;
    });

    function moveFocusBoxToTile(i){
      const container = layout.getBoundingClientRect();
      const t = tileOrder[i].getBoundingClientRect();
      const pad = 7;
      focusBox.style.left = `${(t.left - container.left) - pad}px`;
      focusBox.style.top  = `${(t.top  - container.top ) - pad}px`;
      focusBox.style.width  = `${t.width  + (pad * 2)}px`;
      focusBox.style.height = `${t.height + (pad * 2)}px`;
    }

    function setFocus(i){
      focusedIndex = i;
      tileOrder.forEach((t, idx) => t.classList.toggle("focused", idx === focusedIndex));
      moveFocusBoxToTile(focusedIndex);
      scheduleAutoBackIfNeeded();
    }

    function setFocusPeter(){
      closeConfirm();
      setFocus(peterGlobalIndex);
    }

    // Initial fokus = Peter
    requestAnimationFrame(() => setFocusPeter());

    // Tilbage efter opkald / tilbage til siden: hop til Peter
    window.addEventListener("pageshow", () => requestAnimationFrame(() => setFocusPeter()));
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestAnimationFrame(() => setFocusPeter());
    });

    // Reposition ved resize
    window.addEventListener("resize", () => {
      requestAnimationFrame(() => moveFocusBoxToTile(focusedIndex));
    });
  </script>
</body>
</html>
