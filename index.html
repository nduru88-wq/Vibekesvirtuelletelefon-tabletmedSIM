<style>
:root{
  --bg:#0b1220;
  --text:#fff;
  --muted:rgba(255,255,255,.85);
  --stroke:rgba(255,255,255,.15);
  --radius:20px;
  --shadow:0 8px 25px rgba(0,0,0,.35);
  --gap:14px;
  --pad:14px;
}

*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  overflow:hidden;
}

body{
  background:
    radial-gradient(1200px 800px at 50% 0%, rgba(80,140,255,.25), transparent 55%),
    radial-gradient(900px 600px at 10% 90%, rgba(0,255,170,.10), transparent 55%),
    var(--bg);
  color:var(--text);
}

.page{
  height:100%;
  padding:var(--pad);
  display:flex;
  flex-direction:column;
  gap:12px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}

.topIcon{
  width:55px;
  height:55px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  display:grid;
  place-items:center;
}
.topIcon img{width:70%;height:70%;object-fit:contain}

h1{
  margin:0;
  font-size:clamp(20px,2.5vw,30px);
}

.grid{
  flex:1;
  display:grid;
  gap:var(--gap);
  grid-template-columns:repeat(2,1fr);
  grid-auto-rows:1fr;
}

/* 4x2 layout i landscape */
@media (min-width:900px) and (orientation:landscape){
  .grid{grid-template-columns:repeat(4,1fr);}
}

.card{
  position:relative;
  border-radius:var(--radius);
  overflow:hidden;
  text-decoration:none;
  color:white;
  box-shadow:var(--shadow);
  border:1px solid var(--stroke);
  display:flex;
}

.card img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* Bund-overlay */
.meta{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:10px 8px;
  background:linear-gradient(to top, rgba(0,0,0,.75), rgba(0,0,0,.0));
  text-align:center;
}

.name{
  margin:0;
  font-weight:800;
  font-size:clamp(15px,1.6vw,20px);
}

.phone{
  margin:2px 0 6px 0;
  font-size:clamp(12px,1.3vw,14px);
  color:var(--muted);
}

.callTag{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:rgba(0,255,170,.85);
  color:#000;
  font-weight:800;
  font-size:clamp(12px,1.2vw,14px);
}

.card:active{
  transform:scale(.97);
}
</style>
</head>

<body>
<div class="page">

  </div>
