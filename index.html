<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vibekes telefon</title>

  <link rel="apple-touch-icon" sizes="180x180" href="telefon.png" />
  <link rel="apple-touch-icon" href="telefon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Vibekes telefon" />
  <link rel="icon" href="telefon.png" />

  <style>
    :root{
      --bg:#0b1220;
      --text:#fff;
      --muted:rgba(255,255,255,.78);
      --stroke:rgba(255,255,255,.14);
      --shadow:0 10px 26px rgba(0,0,0,.35);

      --pad:12px;
      --gap:14px;

      --radius:22px;

      /* Fokus */
      --focusScale:1.03;
      --unfocusOpacity:.55;

      /* Ring-knap */
      --btnH:56px;
      --btnHSmall:48px;

      /* Fokusramme */
      --focusBorder:5px;

      /* Avatar sizes */
      --avatarBig:clamp(170px, 26vh, 320px);
      --avatarSmall:clamp(92px, 12vh, 160px);

      /* Layout */
      --sideColW: min(420px, 32vw);
      --centerColW: min(560px, 36vw);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    body{
      background:
        radial-gradient(1200px 800px at 50% 0%, rgba(80,140,255,.25), transparent 55%),
        radial-gradient(900px 600px at 10% 90%, rgba(0,255,170,.10), transparent 55%),
        var(--bg);
      color:var(--text);
      overflow:hidden;
    }

    .page{
      height:100%;
      padding:var(--pad);
      display:flex;
      flex-direction:column;
      gap:12px;
      align-items:center;
      justify-content:flex-start;
    }

    .header{
      width:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      padding-top:4px;
      user-select:none;
    }
    .topIcon{
      width:52px;height:52px;border-radius:14px;
      background:rgba(255,255,255,.08);
      border:1px solid var(--stroke);
      display:grid;place-items:center;
      box-shadow:var(--shadow);
      flex:0 0 auto;
    }
    .topIcon img{width:70%;height:70%;object-fit:contain}
    h1{margin:0;font-size:clamp(18px,2.2vw,28px);letter-spacing:.2px;text-align:center}

    .stage{
      position:relative;
      width:100%;
      flex:1;
      display:flex;
      align-items:stretch;
      justify-content:center;
      overflow:hidden;
    }

    /* 3-kolonne layout: venstre små, midt stor, højre små */
    .layout{
      position:relative;
      width:min(1600px, 100%);
      height:100%;
      display:grid;
      grid-template-columns: var(--sideColW) var(--centerColW) var(--sideColW);
      gap:var(--gap);
      padding:10px;
      border-radius:28px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.08);
      box-shadow:0 20px 60px rgba(0,0,0,.25);
    }

    .sideCol{
      display:grid;
      grid-template-rows:repeat(4, 1fr);
      gap:var(--gap);
      min-height:0;
    }

    .centerCol{
      display:flex;
      align-items:stretch;
      justify-content:center;
      min-height:0;
    }

    .tile{
      position:relative;
      border-radius:var(--radius);
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.07));
      padding:12px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      overflow:hidden;

      opacity:var(--unfocusOpacity);
      transform:scale(.98);
      filter:saturate(.9);
      transition:transform 220ms ease, opacity 220ms ease, filter 220ms ease;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      cursor:pointer;
      min-height:0;
    }

    .tile.focused{
      opacity:1;
      transform:scale(var(--focusScale));
      filter:saturate(1.05);
      cursor:default;
    }

    .tile.big{
      padding:16px;
      justify-content:center;
      gap:14px;
    }

    .tile.small{
      padding:10px 10px 12px;
      gap:8px;
    }

    .avatar{
      width:var(--avatarSmall);
      height:var(--avatarSmall);
      border-radius:999px;
      overflow:hidden;
      border:4px solid rgba(255,255,255,.18);
      background:rgba(255,255,255,.08);
      box-shadow:
        0 10px 22px rgba(0,0,0,.32),
        0 0 0 6px color-mix(in srgb, var(--accent) 20%, transparent),
        0 0 40px color-mix(in srgb, var(--accent) 40%, transparent);
      flex-shrink:0;
    }
    .tile.big .avatar{
      width:var(--avatarBig);
      height:var(--avatarBig);
    }
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}

    .meta{
      width:100%;
      text-align:center;
      margin-top:auto;
      padding:0 8px 4px;
    }
    .tile.big .meta{ margin-top:0; }
    .name{margin:0;font-size:clamp(18px, 2.2vh, 26px);font-weight:950}
    .tile.small .name{ font-size:clamp(16px, 2.0vh, 22px); }
    .phone{margin:4px 0 12px;font-size:clamp(13px, 1.8vh, 16px);color:var(--muted)}
    .tile.small .phone{ margin:3px 0 10px; font-size:clamp(12px, 1.6vh, 15px); }

    /* Ring-knap: kun aktiv i fokus (sikkerhed) */
    .callBtn{
      width:100%;
      height:var(--btnHSmall);
      border-radius:16px;
      border:1px solid color-mix(in srgb, var(--accent) 55%, rgba(255,255,255,.16));
      background:color-mix(in srgb, var(--accent) 32%, rgba(255,255,255,.10));
      color:#fff;
      font-weight:950;
      font-size:16px;
      letter-spacing:.5px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      user-select:none;

      opacity:.35;
      pointer-events:none; /* default: kan ikke ringe */
      transition:opacity 180ms ease, transform 120ms ease;
    }
    .tile.big .callBtn{
      height:var(--btnH);
      font-size:18px;
      border-radius:18px;
    }
    .callBtn:active{ transform:scale(.98); }
    .tile.focused .callBtn{
      opacity:1;
      pointer-events:auto; /* først nu kan man ringe */
      cursor:pointer;
    }
    .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}

    /* Fokusramme */
    .focusBox{
      position:absolute;
      border-radius:calc(var(--radius) + 10px);
      border:var(--focusBorder) solid rgba(255,255,255,.92);
      box-shadow:
        0 0 0 7px rgba(0,0,0,.28),
        0 18px 60px rgba(0,0,0,.45);
      pointer-events:none;
      transition: left 180ms ease, top 180ms ease, width 180ms ease, height 180ms ease;
      will-change:left,top,width,height;
      z-index:50;
    }

    /* Responsivt: hvis smal skærm, så stack (Peter øverst) */
    @media (max-width:1100px){
      .layout{
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .sideCol{ grid-template-rows:repeat(4, auto); }
    }

    @media (max-height:700px){
      :root{
        --btnH:52px;
        --btnHSmall:44px;
        --avatarBig:clamp(150px, 24vh, 280px);
        --avatarSmall:clamp(86px, 11vh, 140px);
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="header">
      <div class="topIcon"><img src="telefon.png" alt=""></div>
      <h1>Vibekes telefon</h1>
      <div class="topIcon"><img src="telefon.png" alt=""></div>
    </div>

    <div class="stage">
      <div class="layout" id="layout" aria-label="Kontakter">
        <div class="sideCol" id="leftCol" aria-label="Venstre kontakter"></div>
        <div class="centerCol" id="centerCol" aria-label="Peter (center)"></div>
        <div class="sideCol" id="rightCol" aria-label="Højre kontakter"></div>

        <!-- Fokusramme (ligger ovenpå alt) -->
        <div class="focusBox" id="focusBox" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <script>
    // === DATA (9 kontakter inkl. Inge Boye) ===
    let contacts = [
      { name:"Peter",     phone:"+4520324378", display:"+45 20 32 43 78", img:"peter.jpg",     accent:"#ffd24a" },
      { name:"Poula",     phone:"+4521538213", display:"+45 21 53 82 13", img:"poula.jpg",     accent:"#54e6a9" },
      { name:"Bente",     phone:"+4528223687", display:"+45 28 22 36 87", img:"bente.jpg",     accent:"#6fb7ff" },
      { name:"Britta",    phone:"+4523985223", display:"+45 23 98 52 23", img:"britta.jpg",    accent:"#ff7ad9" },
      { name:"Else",      phone:"+4542769137", display:"+45 42 76 91 37", img:"else.jpg",      accent:"#ff9b54" },
      { name:"Herdis",    phone:"+4521764268", display:"+45 21 76 42 68", img:"herdis.jpg",    accent:"#b58cff" },
      { name:"Hanne",     phone:"+4528965403", display:"+45 28 96 54 03", img:"hanne.jpg",     accent:"#ff4d4d" },
      { name:"Karen",     phone:"+4541663491", display:"+45 41 66 34 91", img:"karen.jpg",     accent:"#39d0ff" },
      { name:"Inge Boye", phone:"+4522355339", display:"+45 22 35 53 39", img:"ingeboye.jpg",  accent:"#7cff6b" },
    ];

    // Find Peter
    function indexOfPeter(){
      return Math.max(0, contacts.findIndex(c => c.name.toLowerCase() === "peter"));
    }

    // Træk Peter ud til center og fordel resten alfabetisk i siderne
    const peterIndex = indexOfPeter();
    const peter = contacts[peterIndex];

    const others = contacts
      .filter((_, i) => i !== peterIndex)
      .sort((a,b) => a.name.localeCompare(b.name, "da", { sensitivity:"base" }));

    // 4 venstre + 4 højre (i alt 8)
    const left = others.slice(0, 4);
    const right = others.slice(4, 8);

    const leftCol = document.getElementById("leftCol");
    const rightCol = document.getElementById("rightCol");
    const centerCol = document.getElementById("centerCol");
    const layout = document.getElementById("layout");
    const focusBox = document.getElementById("focusBox");

    // Vi laver en samlet liste over tiles i fokus-rækkefølge:
    // venstre (0-3), Peter (4), højre (5-8)
    const tileOrder = [];

    function makeTile(c, globalIndex, sizeClass){
      const tile = document.createElement("div");
      tile.className = `tile ${sizeClass}`;
      tile.style.setProperty("--accent", c.accent);
      tile.dataset.index = String(globalIndex);

      tile.innerHTML = `
        <div class="avatar"><img src="${c.img}" alt="${c.name}"></div>
        <div class="meta">
          <p class="name">${c.name}</p>
          <p class="phone">${c.display}</p>
          <div class="callBtn" role="button" aria-label="Ring til ${c.name}">
            <span class="dot"></span> RING
          </div>
        </div>
      `;

      tile.addEventListener("click", () => setFocus(globalIndex), { passive:true });

      tile.querySelector(".callBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        if (focusedIndex === globalIndex) {
          location.href = `tel:${c.phone}`;
        }
      });

      return tile;
    }

    // Byg venstre kolonne
    left.forEach((c, idx) => {
      const globalIndex = idx; // 0..3
      const tile = makeTile(c, globalIndex, "small");
      leftCol.appendChild(tile);
      tileOrder[globalIndex] = tile;
    });

    // Byg center (Peter)
    const peterGlobalIndex = 4;
    const peterTile = makeTile(peter, peterGlobalIndex, "big");
    centerCol.appendChild(peterTile);
    tileOrder[peterGlobalIndex] = peterTile;

    // Byg højre kolonne
    right.forEach((c, idx) => {
      const globalIndex = 5 + idx; // 5..8
      const tile = makeTile(c, globalIndex, "small");
      rightCol.appendChild(tile);
      tileOrder[globalIndex] = tile;
    });

    let focusedIndex = peterGlobalIndex;

    function moveFocusBoxToTile(i){
      const container = layout.getBoundingClientRect();
      const t = tileOrder[i].getBoundingClientRect();

      const pad = 7; // lidt luft rundt om tile
      const left = (t.left - container.left) - pad;
      const top  = (t.top  - container.top)  - pad;
      const width  = t.width  + (pad * 2);
      const height = t.height + (pad * 2);

      focusBox.style.left = `${left}px`;
      focusBox.style.top = `${top}px`;
      focusBox.style.width = `${width}px`;
      focusBox.style.height = `${height}px`;
    }

    function setFocus(i){
      focusedIndex = i;
      tileOrder.forEach((t, idx) => t.classList.toggle("focused", idx === focusedIndex));
      moveFocusBoxToTile(focusedIndex);
    }

    function setFocusPeter(){
      setFocus(peterGlobalIndex);
    }

    // Initial fokus = Peter
    requestAnimationFrame(() => setFocusPeter());

    // Når man kommer tilbage efter opkald / skifter tilbage til siden:
    window.addEventListener("pageshow", () => requestAnimationFrame(() => setFocusPeter()));
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") requestAnimationFrame(() => setFocusPeter());
    });

    // Reposition ved resize/orientation
    window.addEventListener("resize", () => {
      requestAnimationFrame(() => moveFocusBoxToTile(focusedIndex));
    });
  </script>
</body>
</html>
