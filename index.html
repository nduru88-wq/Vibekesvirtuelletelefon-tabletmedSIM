<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ring</title>

  <!-- iPhone hjemmeskærm ikon -->
  <link rel="apple-touch-icon" sizes="180x180" href="telefon.png" />
  <link rel="apple-touch-icon" href="telefon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ring" />
  <link rel="icon" href="telefon.png" />

  <style>
    :root{
      --bg:#0b1220;
      --card:rgba(255,255,255,.08);
      --card2:rgba(255,255,255,.12);
      --text:#fff;
      --muted:rgba(255,255,255,.75);
      --stroke:rgba(255,255,255,.12);
      --radius:20px;
      --shadow:0 10px 30px rgba(0,0,0,.35);

      /* Tablet-venlige størrelser */
      --gap:14px;
      --pad:14px;
      --max:1200px;

      /* Kort + avatar */
      --cardMinH:140px;
      --avatarSize:92px;
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    body{
      background:
        radial-gradient(1200px 800px at 50% 0%, rgba(80,140,255,.22), transparent 55%),
        radial-gradient(900px 600px at 10% 90%, rgba(0,255,170,.10), transparent 55%),
        var(--bg);
      color:var(--text);
      overflow:hidden; /* vigtigt: vi vil ikke scrolle */
    }

    .page{
      height:100%;
      padding:calc(var(--pad) + env(safe-area-inset-top)) var(--pad) calc(var(--pad) + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      align-items:stretch;
    }

    .wrap{
      width:100%;
      max-width:var(--max);
      display:flex;
      flex-direction:column;
      gap:12px;
      min-height:0; /* så grid kan være fleks */
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      padding:8px 10px;
      flex:0 0 auto;
    }

    .topIcon{
      width:58px;
      height:58px;
      border-radius:16px;
      background:rgba(255,255,255,.06);
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }
    .topIcon img{width:72%;height:72%;object-fit:contain}

    .titles{display:flex;flex-direction:column;align-items:center;gap:2px}
    h1{
      margin:0;
      font-size:clamp(20px,2.4vw,30px);
      line-height:1.1;
    }
    .hint{
      margin:0;
      color:var(--muted);
      font-size:clamp(13px,1.6vw,16px);
      text-align:center;
    }

    /* Grid: fylder resten af skærmen uden scroll */
    .grid{
      flex:1 1 auto;
      min-height:0;
      display:grid;
      gap:var(--gap);

      /* default (smalt): 2 kolonner */
      grid-template-columns:repeat(2, 1fr);

      /* gør rækkerne “lige store” så alt kan være på skærmen */
      grid-auto-rows:1fr;
      align-content:stretch;
    }

    /* Tablet landscape: 4x2 */
    @media (min-width: 900px) and (orientation: landscape){
      .grid{ grid-template-columns:repeat(4, 1fr); }
    }

    /* Hvis der stadig er lidt trangt: reducer en smule */
    @media (max-height: 520px){
      :root{
        --gap:12px;
        --cardMinH:128px;
        --avatarSize:84px;
      }
      .topIcon{width:52px;height:52px}
    }

    .card{
      text-decoration:none;
      color:inherit;
      background:linear-gradient(180deg,var(--card2),var(--card));
      border:1px solid var(--stroke);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:12px;
      display:grid;
      grid-template-rows:auto auto;
      gap:8px;
      min-height:var(--cardMinH);
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      user-select:none;
    }
    .card:active{transform:scale(.985)}

    .avatar{
      width:var(--avatarSize);
      height:var(--avatarSize);
      border-radius:999px;
      background:rgba(255,255,255,.10);
      border:1px solid var(--stroke);
      display:grid;
      place-items:center;
      margin:0 auto;
      overflow:hidden;
    }
    .avatar img{width:100%;height:100%;object-fit:cover;display:block}

    .initial{
      font-size:clamp(34px,3.4vw,48px);
      font-weight:800;
    }

    .meta{text-align:center; line-height:1.05}
    .name{
      margin:0;
      font-size:clamp(16px,1.8vw,22px);
      font-weight:800;
    }
    .phone{
      margin:4px 0 0;
      color:rgba(255,255,255,.78);
      font-size:clamp(12px,1.4vw,15px);
    }

    .callTag{
      margin:8px auto 0;
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:8px 12px;
      border-radius:999px;
      background:rgba(0,255,170,.12);
      border:1px solid rgba(0,255,170,.25);
      font-weight:800;
      letter-spacing:.3px;
      font-size:clamp(12px,1.4vw,14px);
    }
    .dot{width:10px;height:10px;border-radius:50%;background:rgba(0,255,170,.9)}
  </style>
</head>

<body>
<div class="page"><div class="wrap">

  </main>

</body>
