<style>
:root{
  --bg:#0b1220;
  --text:#fff;
  --muted:rgba(255,255,255,.78);
  --stroke:rgba(255,255,255,.14);
  --radius:18px;
  --shadow:0 10px 26px rgba(0,0,0,.35);

  --gap:12px;
  --pad:12px;

  --avatar:200px; /* DOBBELT SÅ STOR */
  --cardPad:8px;
}

*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
}

body{
  background:
    radial-gradient(1200px 800px at 50% 0%, rgba(80,140,255,.25), transparent 55%),
    radial-gradient(900px 600px at 10% 90%, rgba(0,255,170,.10), transparent 55%),
    var(--bg);
  color:var(--text);
  overflow:hidden;
}

.page{
  height:100%;
  padding:var(--pad);
  display:flex;
  flex-direction:column;
  gap:10px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding-top:4px;
}

.topIcon{
  width:50px;
  height:50px;
  border-radius:14px;
  background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);
  display:grid;
  place-items:center;
  box-shadow:var(--shadow);
}
.topIcon img{width:70%;height:70%;object-fit:contain}

h1{
  margin:0;
  font-size:clamp(18px,2vw,26px);
}

.grid{
  flex:1;
  display:grid;
  gap:var(--gap);
  grid-template-columns:repeat(2,1fr);
  grid-auto-rows:1fr;
}

@media (min-width:900px) and (orientation:landscape){
  .grid{ grid-template-columns:repeat(4,1fr); }
}

.card{
  text-decoration:none;
  color:inherit;
  border-radius:var(--radius);
  border:1px solid var(--stroke);
  box-shadow:var(--shadow);
  background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.07));
  padding:var(--cardPad);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  gap:6px;
  overflow:hidden;
}

.card:active{ transform:scale(.98); }

.avatar{
  width:var(--avatar);
  height:var(--avatar);
  border-radius:999px;
  overflow:hidden;
  border:4px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.08);
  box-shadow:
    0 10px 22px rgba(0,0,0,.32),
    0 0 0 6px color-mix(in srgb, var(--accent) 20%, transparent),
    0 0 40px color-mix(in srgb, var(--accent) 40%, transparent);
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.meta{
  text-align:center;
  margin-top:auto;
}

.name{
  margin:0;
  font-size:18px;
  font-weight:900;
}

.phone{
  margin:2px 0 6px;
  font-size:14px;
  color:var(--muted);
}

.callTag{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:6px 12px;
  border-radius:999px;
  font-weight:900;
  font-size:14px;
  background:color-mix(in srgb, var(--accent) 30%, rgba(255,255,255,.08));
  border:1px solid color-mix(in srgb, var(--accent) 60%, rgba(255,255,255,.14));
  color:#fff;
}

.dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent);
}
</style>
</head>

<body>
